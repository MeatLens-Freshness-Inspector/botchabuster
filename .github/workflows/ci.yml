name: Automated Testing

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TZ: UTC

jobs:
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.classify.outputs.frontend }}
      backend: ${{ steps.classify.outputs.backend }}
      shared: ${{ steps.classify.outputs.shared }}
      docs_only: ${{ steps.classify.outputs.docsOnly }}
      workflow: ${{ steps.classify.outputs.workflow }}
      any_relevant_changes: ${{ steps.classify.outputs.anyRelevantChanges }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - id: classify
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "${{ github.event_name }}" == "schedule" ]]; then
            {
              echo "frontend=true"
              echo "backend=true"
              echo "shared=true"
              echo "docsOnly=false"
              echo "workflow=false"
              echo "anyRelevantChanges=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          head_sha="${{ github.sha }}"

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          else
            base_sha="${{ github.event.before }}"
            if [[ -z "$base_sha" || "$base_sha" == "0000000000000000000000000000000000000000" ]]; then
              base_sha="$(git rev-parse HEAD^)"
            fi
          fi

          mapfile -t changed_files < <(git diff --name-only "$base_sha" "$head_sha")

          if (( ${#changed_files[@]} == 0 )); then
            {
              echo "frontend=false"
              echo "backend=false"
              echo "shared=false"
              echo "docsOnly=false"
              echo "workflow=false"
              echo "anyRelevantChanges=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          node scripts/ci-paths.mjs "${changed_files[@]}" >> "$GITHUB_OUTPUT"

      - name: Publish change summary
        shell: bash
        run: |
          {
            echo "## Change Detection"
            echo
            echo "- Frontend: ${{ steps.classify.outputs.frontend }}"
            echo "- Backend: ${{ steps.classify.outputs.backend }}"
            echo "- Shared: ${{ steps.classify.outputs.shared }}"
            echo "- Workflow: ${{ steps.classify.outputs.workflow }}"
            echo "- Docs only: ${{ steps.classify.outputs.docsOnly }}"
            echo "- Any relevant changes: ${{ steps.classify.outputs.anyRelevantChanges }}"
          } >> "$GITHUB_STEP_SUMMARY"

  dependencies:
    name: Install Shared Node Dependencies
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.any_relevant_changes == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Cache installed dependencies
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            frontend/node_modules
            backend/node_modules
          key: ${{ runner.os }}-node-modules-node22-${{ hashFiles('package-lock.json', 'frontend/package-lock.json', 'backend/package-lock.json') }}
      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

  playwright-dependencies:
    name: Install Shared Playwright Dependencies
    runs-on: ubuntu-latest
    needs:
      - changes
      - dependencies
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Cache installed dependencies
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            frontend/node_modules
            backend/node_modules
          key: ${{ runner.os }}-node-modules-node22-${{ hashFiles('package-lock.json', 'frontend/package-lock.json', 'backend/package-lock.json') }}
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json', 'frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install dependencies if the shared cache is unavailable
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Install Playwright browser and OS dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

  docs-only:
    name: Docs-only Skip
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs_only == 'true'
    steps:
      - name: Record docs-only result
        run: |
          {
            echo "## Automated Testing"
            echo
            echo "Docs-only changes detected, so the expensive test lanes were skipped."
          } >> "$GITHUB_STEP_SUMMARY"

  docs-validation:
    name: Documentation Validation
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs_only == 'true' || needs.changes.outputs.any_relevant_changes == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: timeout 110s npm run test:documentation

  lint-and-types:
    name: Lint and Typecheck
    runs-on: ubuntu-latest
    needs:
      - changes
      - dependencies
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.any_relevant_changes == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Restore installed dependencies
        id: node-modules-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            frontend/node_modules
            backend/node_modules
          key: ${{ runner.os }}-node-modules-node22-${{ hashFiles('package-lock.json', 'frontend/package-lock.json', 'backend/package-lock.json') }}
      - run: npm ci --prefer-offline --no-audit --no-fund
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
      - run: npm run lint
      - run: npm run typecheck

  script-tests:
    name: Script Tests
    runs-on: ubuntu-latest
    needs:
      - changes
      - dependencies
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.any_relevant_changes == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Restore installed dependencies
        id: node-modules-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            frontend/node_modules
            backend/node_modules
          key: ${{ runner.os }}-node-modules-node22-${{ hashFiles('package-lock.json', 'frontend/package-lock.json', 'backend/package-lock.json') }}
      - run: npm ci --prefer-offline --no-audit --no-fund
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
      - run: timeout 110s npm run test:scripts

  backend-unit:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    needs:
      - changes
      - dependencies
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Restore installed dependencies
        id: node-modules-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            frontend/node_modules
            backend/node_modules
          key: ${{ runner.os }}-node-modules-node22-${{ hashFiles('package-lock.json', 'frontend/package-lock.json', 'backend/package-lock.json') }}
      - run: npm ci --prefer-offline --no-audit --no-fund
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
      - run: timeout 110s npm run test:unit -w backend

  backend-architecture:
    name: Backend Architecture Tests
    runs-on: ubuntu-latest
    needs:
      - changes
      - dependencies
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Restore installed dependencies
        id: node-modules-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            frontend/node_modules
            backend/node_modules
          key: ${{ runner.os }}-node-modules-node22-${{ hashFiles('package-lock.json', 'frontend/package-lock.json', 'backend/package-lock.json') }}
      - run: npm ci --prefer-offline --no-audit --no-fund
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
      - run: timeout 110s npm run test:architecture -w backend

  frontend-tests:
    name: Frontend Unit, Component, and Integration Tests (${{ matrix.suite }})
    runs-on: ubuntu-latest
    needs:
      - changes
      - dependencies
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.frontend == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: unit shard 1/4
            command: timeout 110s npm run test:unit:ci -w frontend -- --shard=1/4
          - suite: unit shard 2/4
            command: timeout 110s npm run test:unit:ci -w frontend -- --shard=2/4
          - suite: unit shard 3/4
            command: timeout 110s npm run test:unit:ci -w frontend -- --shard=3/4
          - suite: unit shard 4/4
            command: timeout 110s npm run test:unit:ci -w frontend -- --shard=4/4
          - suite: component
            command: timeout 110s npm run test:component -w frontend
          - suite: integration
            command: timeout 110s npm run test:integration -w frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Restore installed dependencies
        id: node-modules-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            frontend/node_modules
            backend/node_modules
          key: ${{ runner.os }}-node-modules-node22-${{ hashFiles('package-lock.json', 'frontend/package-lock.json', 'backend/package-lock.json') }}
      - run: npm ci --prefer-offline --no-audit --no-fund
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
      - name: Run ${{ matrix.suite }}
        run: ${{ matrix.command }}

  backend-integration:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    needs:
      - changes
      - dependencies
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Restore installed dependencies
        id: node-modules-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            frontend/node_modules
            backend/node_modules
          key: ${{ runner.os }}-node-modules-node22-${{ hashFiles('package-lock.json', 'frontend/package-lock.json', 'backend/package-lock.json') }}
      - run: npm ci --prefer-offline --no-audit --no-fund
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
      - run: timeout 110s npm run test:backend:integration

  contract-tests:
    name: Contract Tests
    runs-on: ubuntu-latest
    needs:
      - changes
      - dependencies
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.any_relevant_changes == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Restore installed dependencies
        id: node-modules-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            frontend/node_modules
            backend/node_modules
          key: ${{ runner.os }}-node-modules-node22-${{ hashFiles('package-lock.json', 'frontend/package-lock.json', 'backend/package-lock.json') }}
      - run: npm ci --prefer-offline --no-audit --no-fund
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
      - run: timeout 110s npm run test:contract

  build:
    name: Build Verification
    runs-on: ubuntu-latest
    needs:
      - changes
      - dependencies
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.any_relevant_changes == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Restore installed dependencies
        id: node-modules-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            frontend/node_modules
            backend/node_modules
          key: ${{ runner.os }}-node-modules-node22-${{ hashFiles('package-lock.json', 'frontend/package-lock.json', 'backend/package-lock.json') }}
      - run: npm ci --prefer-offline --no-audit --no-fund
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
      - run: npm run build

  e2e-critical:
    name: Critical Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs:
      - changes
      - dependencies
      - playwright-dependencies
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Restore installed dependencies
        id: node-modules-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            frontend/node_modules
            backend/node_modules
          key: ${{ runner.os }}-node-modules-node22-${{ hashFiles('package-lock.json', 'frontend/package-lock.json', 'backend/package-lock.json') }}
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json', 'frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - run: npm ci --prefer-offline --no-audit --no-fund
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
      - run: npx playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - name: Install Playwright OS dependencies on this runner
        run: npx playwright install-deps chromium
      - name: Run critical Playwright tests
        id: playwright
        run: timeout 110s npm run test:e2e:critical
      - name: Summarize critical Playwright run
        if: always()
        env:
          RESULT: ${{ steps.playwright.outcome }}
        shell: bash
        run: |
          {
            echo "## Critical Playwright"
            echo
            echo "- Result: $RESULT"
            echo '- Command: `timeout 110s npm run test:e2e:critical`'
            for artifact_path in frontend/playwright-report frontend/test-results; do
              if [[ -e "$artifact_path" ]]; then
                echo "- Artifact path present: \`$artifact_path\`"
              else
                echo "- Artifact path missing: \`$artifact_path\`"
              fi
            done
            if [[ -d frontend/test-results ]]; then
              echo
              echo "### Result directories"
              find frontend/test-results -mindepth 1 -maxdepth 2 -type d -print | sort | sed 's/^/- `/; s/$/`/'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload critical Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-critical-${{ github.run_id }}
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

  infrastructure-tests:
    name: Infrastructure Tests
    runs-on: ubuntu-latest
    needs:
      - changes
      - dependencies
    if: github.event_name != 'pull_request' && needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Restore installed dependencies
        id: node-modules-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            frontend/node_modules
            backend/node_modules
          key: ${{ runner.os }}-node-modules-node22-${{ hashFiles('package-lock.json', 'frontend/package-lock.json', 'backend/package-lock.json') }}
      - run: npm ci --prefer-offline --no-audit --no-fund
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
      - run: timeout 110s npm run test:infrastructure

  full-playwright:
    name: Full Playwright (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs:
      - changes
      - dependencies
      - playwright-dependencies
    if: github.event_name != 'pull_request' && needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.frontend == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 1
          - 2
          - 3
          - 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Restore installed dependencies
        id: node-modules-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            frontend/node_modules
            backend/node_modules
          key: ${{ runner.os }}-node-modules-node22-${{ hashFiles('package-lock.json', 'frontend/package-lock.json', 'backend/package-lock.json') }}
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json', 'frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - run: npm ci --prefer-offline --no-audit --no-fund
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
      - run: npx playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - name: Install Playwright OS dependencies on this runner
        run: npx playwright install-deps chromium
      - name: Run full Playwright tests
        id: playwright
        run: timeout 110s npm run test:e2e:full -- --shard=${{ matrix.shard }}/4
      - name: Summarize full Playwright run
        if: always()
        env:
          RESULT: ${{ steps.playwright.outcome }}
          SHARD: ${{ matrix.shard }}/4
        shell: bash
        run: |
          {
            echo "## Full Playwright (shard $SHARD)"
            echo
            echo "- Result: $RESULT"
            echo "- Command: \`timeout 110s npm run test:e2e:full -- --shard=$SHARD\`"
            for artifact_path in frontend/playwright-report frontend/test-results; do
              if [[ -e "$artifact_path" ]]; then
                echo "- Artifact path present: \`$artifact_path\`"
              else
                echo "- Artifact path missing: \`$artifact_path\`"
              fi
            done
            if [[ -d frontend/test-results ]]; then
              echo
              echo "### Result directories"
              find frontend/test-results -mindepth 1 -maxdepth 2 -type d -print | sort | sed 's/^/- `/; s/$/`/'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload full Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-full-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

  quality-gate:
    name: CI Quality Gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - changes
      - dependencies
      - playwright-dependencies
      - docs-only
      - docs-validation
      - lint-and-types
      - script-tests
      - backend-unit
      - backend-architecture
      - frontend-tests
      - backend-integration
      - contract-tests
      - build
      - e2e-critical
      - infrastructure-tests
      - full-playwright
    steps:
      - name: Summarize job results
        env:
          CHANGES: ${{ needs['changes'].result }}
          DEPENDENCIES: ${{ needs['dependencies'].result }}
          PLAYWRIGHT_DEPENDENCIES: ${{ needs['playwright-dependencies'].result }}
          DOCS_ONLY: ${{ needs['docs-only'].result }}
          DOCS_VALIDATION: ${{ needs['docs-validation'].result }}
          LINT_TYPES: ${{ needs['lint-and-types'].result }}
          SCRIPT_TESTS: ${{ needs['script-tests'].result }}
          BACKEND_UNIT: ${{ needs['backend-unit'].result }}
          BACKEND_ARCHITECTURE: ${{ needs['backend-architecture'].result }}
          FRONTEND_TESTS: ${{ needs['frontend-tests'].result }}
          BACKEND_INTEGRATION: ${{ needs['backend-integration'].result }}
          CONTRACT_TESTS: ${{ needs['contract-tests'].result }}
          BUILD: ${{ needs['build'].result }}
          E2E_CRITICAL: ${{ needs['e2e-critical'].result }}
          INFRASTRUCTURE: ${{ needs['infrastructure-tests'].result }}
          FULL_PLAYWRIGHT: ${{ needs['full-playwright'].result }}
        shell: bash
        run: |
          {
            echo "## CI Quality Gate"
            echo
            printf '| Job | Result |\n| --- | --- |\n'
            printf '| Change detection | %s |\n' "$CHANGES"
            printf '| Shared dependencies | %s |\n' "$DEPENDENCIES"
            printf '| Shared Playwright dependencies | %s |\n' "$PLAYWRIGHT_DEPENDENCIES"
            printf '| Docs-only summary | %s |\n' "$DOCS_ONLY"
            printf '| Documentation validation | %s |\n' "$DOCS_VALIDATION"
            printf '| Lint and typecheck | %s |\n' "$LINT_TYPES"
            printf '| Script tests | %s |\n' "$SCRIPT_TESTS"
            printf '| Backend unit | %s |\n' "$BACKEND_UNIT"
            printf '| Backend architecture | %s |\n' "$BACKEND_ARCHITECTURE"
            printf '| Frontend tests | %s |\n' "$FRONTEND_TESTS"
            printf '| Backend integration | %s |\n' "$BACKEND_INTEGRATION"
            printf '| Contract tests | %s |\n' "$CONTRACT_TESTS"
            printf '| Build | %s |\n' "$BUILD"
            printf '| Critical Playwright | %s |\n' "$E2E_CRITICAL"
            printf '| Infrastructure tests | %s |\n' "$INFRASTRUCTURE"
            printf '| Full Playwright | %s |\n' "$FULL_PLAYWRIGHT"
          } >> "$GITHUB_STEP_SUMMARY"

          for result in "$CHANGES" "$DEPENDENCIES" "$PLAYWRIGHT_DEPENDENCIES" "$DOCS_ONLY" "$DOCS_VALIDATION" "$LINT_TYPES" "$SCRIPT_TESTS" "$BACKEND_UNIT" "$BACKEND_ARCHITECTURE" "$FRONTEND_TESTS" "$BACKEND_INTEGRATION" "$CONTRACT_TESTS" "$BUILD" "$E2E_CRITICAL" "$INFRASTRUCTURE" "$FULL_PLAYWRIGHT"; do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              exit 1
            fi
          done
